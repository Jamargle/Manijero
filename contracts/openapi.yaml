openapi: 3.1.0
info:
  title: Manijero Answer Service API
  version: 0.1.0
  description: >-
    Contract for source-grounded Spanish answers. Land context is deliberately minimal:
    local names, notes, precise parcel identifiers, and arbitrary personal data are not sent.
servers:
  - url: https://api.example.invalid
paths:
  /ask:
    post:
      operationId: askQuestion
      summary: Ask for a source-grounded answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '200':
          description: Answer state; inspect `status` for the next client action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
        '400':
          description: Malformed request.
        '401':
          description: Pilot profile only. The per-client bearer token is missing or unknown; the response is generic and carries no credential detail.
        '413':
          description: The request body exceeds the service bound; the response is generic and echoes no request value.
        '422':
          description: Request shape or enum validation failed.
        '429':
          description: Pilot profile only. This client exceeded its per-minute request allowance. Limits are enforced per service process.
        '503':
          description: The local answer corpus is unavailable, unsafe, or lacks valid MANIJERO_ACTIVE_CAMPAIGN configuration. The response is generic and contains no corpus details.
  /feedback:
    post:
      operationId: submitAnswerFeedback
      summary: Report whether an answer was useful
      description: >-
        Anonymous and unlinked: the only field is a fixed rating. No question, answer, land
        context, answer id, client/device identifier, or free text is accepted or kept; the
        service stores no feedback record and exposes only aggregate, per-process counts, so
        feedback cannot be joined to a particular answer, question, or person. There is no
        idempotency key, so a client retry after an unknown outcome counts again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '204':
          description: Feedback accepted. The response has no body.
        '400':
          description: Malformed JSON request; the response echoes no submitted value.
        '401':
          description: Pilot profile only. The per-client bearer token is missing or unknown; the response is generic and carries no credential detail.
        '413':
          description: The request body exceeds the service bound; the response is generic and echoes no request value.
        '422':
          description: The request is not exactly one allowed rating; the response echoes no submitted value.
        '429':
          description: Pilot profile only. This client exceeded its per-minute feedback allowance. Limits are enforced per service process.
components:
  schemas:
    AskRequest:
      type: object
      additionalProperties: false
      required: [question, land_context]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
          description: Original user wording; do not silently rewrite it.
        land_context:
          $ref: '#/components/schemas/LandContext'
        retain_for_improvement:
          type: boolean
          default: false
          description: >-
            Explicit permission, given for this one question, to keep the redacted question
            and final answer for product improvement. Absent means false. It never changes
            the answer. When the service has retention configured, only a conservatively
            redacted question and answer are kept, without land context, land IDs, or
            client/device identifiers, and they are deleted no later than 30 days later.
            Clarification responses are never retained.
    FeedbackRequest:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating:
          type: string
          enum: [useful, not_useful]
          description: >-
            Whether the answer was useful. No other value, key, comment, question, answer,
            land, identifier, or free text is accepted or kept.
    LandContext:
      type: object
      additionalProperties: false
      required: [mode, lands]
      properties:
        mode:
          type: string
          enum: [general, all_active, selected]
        lands:
          type: array
          description: Empty for general; all relevant active records for all_active; selected records for selected.
          items:
            $ref: '#/components/schemas/MinimalLandContext'
    MinimalLandContext:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: Opaque stable local ID; the client resolves it to a label locally.
        municipality:
          type: string
          minLength: 1
          maxLength: 160
        water_regime:
          type: string
          enum: [dryland, irrigated, mixed, unknown]
        production_method:
          type: string
          enum: [conventional, organic, mixed, unknown]
    AskResponse:
      type: object
      additionalProperties: false
      required: [status, answer, sources, land_scope, land_ids_to_choose]
      properties:
        status:
          type: string
          enum: [answered, abstained, needs_land_clarification]
        answer:
          type: string
          maxLength: 1200
          description: Empty only while asking the client to choose lands.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AnswerSource'
        land_scope:
          type: string
          enum: [general, all_active, selected]
        land_ids_to_choose:
          type: array
          description: Existing opaque IDs only; populated only for clarification.
          items:
            type: string
            minLength: 1
            maxLength: 128
        inspection:
          $ref: '#/components/schemas/AnswerInspection'
    AnswerInspection:
      type: object
      additionalProperties: false
      description: >-
        Development-profile-only debug view of one answer: retrieved passages, scores, and
        verification codes. Sent only when the service states the deployment profile
        `development`; never sent by pilot, QA, or production, nor when the profile is
        unset or unknown. Ids, scores, fixed codes, timings, and public corpus text only.
      required: [schema, retrieval, drafting, verification, outcome, total_ms]
      properties:
        schema:
          type: string
          enum: [answer-inspection-v1]
        retrieval:
          type: [object, "null"]
          additionalProperties: false
          required: [mode, k, search_calls, duration_ms, vector, passages]
          properties:
            mode:
              type: string
              enum: [bm25, hybrid]
            k:
              type: integer
            search_calls:
              type: integer
            duration_ms:
              type: integer
            vector:
              type: [object, "null"]
              additionalProperties: false
              required: [used, fallback_code]
              properties:
                used:
                  type: boolean
                fallback_code:
                  type: [string, "null"]
            passages:
              type: array
              description: One per final candidate, at most k, in rank order.
              items:
                type: object
                additionalProperties: false
                required: [rank, passage_id, source_id, title, location, score, lexical_rank, lexical_score, vector_similarity, cited, excerpt]
                properties:
                  rank:
                    type: integer
                  passage_id:
                    type: string
                  source_id:
                    type: string
                  title:
                    type: string
                  location:
                    type: string
                  score:
                    type: number
                  lexical_rank:
                    type: [integer, "null"]
                  lexical_score:
                    type: [number, "null"]
                  vector_similarity:
                    type: [number, "null"]
                  cited:
                    type: boolean
                  excerpt:
                    type: string
                    maxLength: 2000
        drafting:
          type: [object, "null"]
          additionalProperties: false
          required: [provider, outcome, status, cited_markers, duration_ms]
          properties:
            provider:
              type: [string, "null"]
            outcome:
              type: [string, "null"]
            status:
              type: [string, "null"]
            cited_markers:
              type: array
              items:
                type: integer
            duration_ms:
              type: [integer, "null"]
        verification:
          type: [object, "null"]
          additionalProperties: false
          required: [ok, issues, claims, duration_ms]
          properties:
            ok:
              type: boolean
            issues:
              type: array
              items:
                type: string
            claims:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [index, markers, ok, issues]
                properties:
                  index:
                    type: integer
                  markers:
                    type: array
                    items:
                      type: integer
                  ok:
                    type: boolean
                  issues:
                    type: array
                    items:
                      type: string
            duration_ms:
              type: [integer, "null"]
        outcome:
          type: object
          additionalProperties: false
          required: [abstention_reason, generation_reason, cited_passage_ids]
          properties:
            abstention_reason:
              type: [string, "null"]
            generation_reason:
              type: [string, "null"]
            cited_passage_ids:
              type: array
              items:
                type: string
        total_ms:
          type: integer
    AnswerSource:
      type: object
      additionalProperties: false
      required: [title, issuing_body, url, location, published_or_updated_on, verified_on, excerpt]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        issuing_body:
          type: string
          minLength: 1
          maxLength: 200
        url:
          type: string
          format: uri
          description: Stable official source URL.
        location:
          type: string
          minLength: 1
          maxLength: 200
          description: Article, page, section, or equivalent location.
        published_or_updated_on:
          type: string
          format: date
        verified_on:
          type: string
          format: date
        excerpt:
          type: string
          minLength: 1
          maxLength: 2000
